<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Document Subtle Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Soft Drop Shadow for Document -->
    <filter id="docShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Glow for Badge -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Document Sheet -->
  <g filter="url(#docShadow)">
    <path d="M 34 26
             L 74 26
             L 94 46
             L 94 98
             A 6 6 0 0 1 88 104
             L 40 104
             A 6 6 0 0 1 34 98
             L 34 32
             A 6 6 0 0 1 40 26 Z"
          fill="url(#docGrad)" />

    <!-- Folded Corner -->
    <path d="M 74 26
             L 74 44
             A 2 2 0 0 0 76 46
             L 94 46 Z"
          fill="url(#foldGrad)" />
  </g>

  <!-- Document Text Accent Lines -->
  <!-- Header line -->
  <rect x="44" y="56" width="34" height="5.5" rx="2.75" fill="#2563eb" />
  <!-- Body line 1 -->
  <rect x="44" y="68" width="40" height="4" rx="2" fill="#64748b" />
  <!-- Body line 2 -->
  <rect x="44" y="77" width="28" height="4" rx="2" fill="#94a3b8" />
  <!-- Body line 3 -->
  <rect x="44" y="86" width="20" height="4" rx="2" fill="#cbd5e1" />

  <!-- Download Action Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="86" cy="94" r="14" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Down Arrow Icon -->
    <path d="M 86 86 L 86 98 M 81.5 94.5 L 86 99 L 90.5 94.5"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
