<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BWD — Bajar Web Docs</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app-container">

    <!-- 1. HEADER CORPORATIVO SOBRIO -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="brand-details">
          <div class="brand-title-wrap">
            <h1 class="brand-title">Bajar Web Docs</h1>
            <span class="version-badge">v0.2</span>
          </div>
          <div class="domain-indicator" title="Pestaña activa">
            <span class="domain-dot"></span>
            <span id="tabHost" class="domain-text">Detectando página activa...</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. ACCIONES PRINCIPALES (FILAS EJECUTIVAS) -->
    <main class="app-main">
      <div class="section-label">Opciones de Exportación</div>

      <div class="action-stack">

        <!-- Acción 1: PDF Fiel -->
        <button id="btnPdfVisual" class="action-row is-recommended" type="button" tabindex="0">
          <div class="action-icon-box icon-pdf">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <polyline points="9 15 12 18 15 15"></polyline>
            </svg>
          </div>
          <div class="action-meta">
            <div class="action-headline">
              <span class="action-name">Descargar PDF Fiel</span>
              <span class="tag-pill tag-primary">A4 Paginado</span>
            </div>
            <p class="action-summary">Respeta el diseño exacto, colores y disposición en pantalla.</p>
          </div>
          <div class="action-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </button>

        <!-- Acción 2: Exportar a Word -->
        <button id="btnDocx" class="action-row" type="button" tabindex="0">
          <div class="action-icon-box icon-doc">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <line x1="10" y1="6" x2="16" y2="6"></line>
              <line x1="10" y1="10" x2="16" y2="10"></line>
            </svg>
          </div>
          <div class="action-meta">
            <div class="action-headline">
              <span class="action-name">Exportar a Word</span>
              <span class="tag-pill">Editable .doc</span>
            </div>
            <p class="action-summary">Artículo limpio y formateado, listo para Word o LibreOffice.</p>
          </div>
          <div class="action-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </button>

        <!-- Acción 3: Captura Completa PNG -->
        <button id="btnPngFull" class="action-row" type="button" tabindex="0">
          <div class="action-icon-box icon-png">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <div class="action-meta">
            <div class="action-headline">
              <span class="action-name">Captura Completa HD</span>
              <span class="tag-pill">Imagen PNG</span>
            </div>
            <p class="action-summary">Captura continua de toda la altura del sitio web en alta resolución.</p>
          </div>
          <div class="action-arrow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </button>

      </div>

      <!-- 3. PREFERENCIAS DE CAPTURA (PANEL COMPACTO) -->
      <div class="settings-card">
        <div class="settings-header">
          <span class="settings-title">Preferencias de Renderizado</span>
        </div>

        <div class="settings-list">
          <label class="setting-item" data-tooltip="Oculta banners de cookies, modales y barras de cabecera fijas que obstruyen el contenido">
            <span class="setting-label">Filtrar avisos de cookies y barras fijas</span>
            <span class="ui-switch">
              <input type="checkbox" id="cleanDom" checked>
              <span class="ui-switch-track"></span>
            </span>
          </label>

          <label class="setting-item" data-tooltip="Despliega cajas y listas internas con scroll para evitar texto cortado">
            <span class="setting-label">Expandir bloques con scroll interno</span>
            <span class="ui-switch">
              <input type="checkbox" id="expandScroll" checked>
              <span class="ui-switch-track"></span>
            </span>
          </label>

          <label class="setting-item" data-tooltip="Duplica la resolución del canvas (2x) para textos y diagramas más nítidos">
            <span class="setting-label">Alta definición (Súper-muestreo 2x)</span>
            <span class="ui-switch">
              <input type="checkbox" id="highQuality" checked>
              <span class="ui-switch-track"></span>
            </span>
          </label>
        </div>
      </div>

      <!-- 4. BARRA DE PROGRESO DISCRETA -->
      <div id="progressSection" class="progress-container" style="display: none;">
        <div class="progress-info">
          <span id="progressLabel" class="progress-task">Procesando...</span>
          <span id="progressPercent" class="progress-val">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- 5. ESTADO DEL SISTEMA -->
      <footer class="app-footer">
        <div id="status" class="status-indicator">
          <span class="status-dot"></span>
          <span id="statusText">Listo para procesar</span>
        </div>
      </footer>

    </main>

  </div>

  <script src="../libs/html2canvas.min.js"></script>
  <script src="../libs/jspdf.umd.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
